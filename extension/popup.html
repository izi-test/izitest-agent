<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 300px; padding: 16px; font-family: -apple-system, sans-serif; font-size: 13px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
  .status.connected { background: #ecfdf5; color: #065f46; }
  .status.disconnected { background: #fef2f2; color: #991b1b; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.on { background: #10b981; }
  .dot.off { background: #ef4444; }
  label { display: block; font-weight: 500; margin-bottom: 4px; color: #555; }
  input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
  input:focus { outline: none; border-color: #7c3aed; }
  button { width: 100%; padding: 8px; background: #7c3aed; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
  button:hover { background: #6d28d9; }
  .info { font-size: 11px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
  <h1>🎯 Browser Pilot</h1>
  <div id="status" class="status disconnected">
    <span id="dot" class="dot off"></span>
    <span id="statusText">Disconnected</span>
  </div>
  <label>Profile ID</label>
  <input type="text" id="profileId" placeholder="my-profile-name">
  <button id="saveBtn">Save & Reconnect</button>
  <p class="info">This extension connects to the Browser Pilot bridge server for remote control via Claude MCP.</p>

  <script>
    const statusEl = document.getElementById('status');
    const dotEl = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const profileInput = document.getElementById('profileId');
    const saveBtn = document.getElementById('saveBtn');

    chrome.runtime.sendMessage({ type: 'getStatus' }, (resp) => {
      if (resp?.connected) {
        statusEl.className = 'status connected';
        dotEl.className = 'dot on';
        statusText.textContent = 'Connected';
      }
      if (resp?.profileId) {
        profileInput.value = resp.profileId;
      }
    });

    saveBtn.addEventListener('click', () => {
      const pid = profileInput.value.trim();
      if (!pid) return;
      chrome.runtime.sendMessage({ type: 'setProfileId', profileId: pid }, () => {
        chrome.runtime.sendMessage({ type: 'reconnect' });
        statusText.textContent = 'Reconnecting...';
      });
    });
  </script>
</body>
</html>
